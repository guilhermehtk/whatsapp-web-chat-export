<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Chat Exporter Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #e2e8f0; }
    button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 12px; }
    canvas { display: none; }
    #status { margin-top: 12px; color: #94a3b8; font-size: 13px; }
    #preview { margin-top: 16px; background: #1e293b; padding: 12px; border-radius: 8px; display: inline-block; }
    #preview svg { display: block; }
  </style>
</head>
<body>
  <h2>Icon Generator</h2>
  <p>Click the button to generate icon16.png, icon32.png, icon48.png, and icon128.png.</p>

  <!-- Inline SVG source — edit this to change the icon -->
  <div id="preview">
    <svg id="source-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 148" width="128" height="128">
      <rect x="10" y="10" width="128" height="128" rx="28" fill="#2563EB"/>
      <path d="M43 29h42l22 22v59a9 9 0 0 1-9 9H43a9 9 0 0 1-9-9V38a9 9 0 0 1 9-9z" fill="white"/>
      <path d="M85 29v22h22" fill="#BFDBFE"/>
      <path d="M53 69h35M53 82h27" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>
      <path d="M74 91v20m0 0-10-10m10 10 10-10M58 119h32" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <br>
  <button id="go">Generate &amp; Download All Sizes</button>
  <div id="status"></div>
  <canvas id="c"></canvas>

  <script>
    document.getElementById('go').addEventListener('click', async () => {
      const status = document.getElementById('status');
      const sizes = [16, 32, 48, 128];

      status.textContent = 'Generating…';

      // Serialize the inline SVG to a blob URL — no file:// fetch needed
      const svgEl = document.getElementById('source-svg');
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svgEl);
      const blob = new Blob([svgStr], { type: 'image/svg+xml' });
      const svgUrl = URL.createObjectURL(blob);

      const img = new Image();
      img.src = svgUrl;
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error('SVG failed to load'));
      });

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      for (const size of sizes) {
        canvas.width  = size;
        canvas.height = size;
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);

        await new Promise(resolve => canvas.toBlob(pngBlob => {
          const url = URL.createObjectURL(pngBlob);
          const a   = document.createElement('a');
          a.href     = url;
          a.download = `icon${size}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 3000);
          resolve();
        }, 'image/png'));

        status.textContent = `Generated icon${size}.png`;
        await new Promise(r => setTimeout(r, 150));
      }

      URL.revokeObjectURL(svgUrl);
      status.textContent = 'Done! Place the downloaded PNGs in the icons/ folder.';
    });
  </script>
</body>
</html>
