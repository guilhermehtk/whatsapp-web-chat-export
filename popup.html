<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    header img {
      width: 28px;
      height: 28px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #60a5fa;
    }

    #chat-name {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 18px;
    }

    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      padding: 7px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      margin-bottom: 12px;
      appearance: none;
      cursor: pointer;
    }

    select:focus { outline: none; border-color: #3b82f6; }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: 0.88; }

    #btn-export {
      background: #2563eb;
      color: #fff;
    }

    #btn-scroll-export {
      background: #334155;
      color: #e2e8f0;
    }

    #btn-stop {
      background: #e53935;
      color: #fff;
      display: none;
    }

    #status {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      min-height: 18px;
      text-align: center;
    }

    #status.error { color: #f28b82; }
    #status.ok    { color: #60a5fa; }

    #multi {
      margin-top: 10px;
      border-top: 1px solid #334155;
      padding-top: 10px;
    }

    #multi summary {
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    #chat-search {
      width: 100%;
      padding: 7px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      margin-bottom: 6px;
    }

    #chat-list {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 8px;
      font-size: 12px;
    }

    #chat-list label, .select-all {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
      font-size: 12px;
      margin-bottom: 3px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #btn-load-chats, #btn-export-selected {
      background: #334155;
      color: #e2e8f0;
    }

    .disclaimer {
      margin-top: 10px;
      color: #64748b;
      font-size: 10px;
      line-height: 1.35;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon128.png" alt="">
    <h1>Chat Exporter</h1>
  </header>

  <div id="chat-name">Opening chat…</div>

  <label for="format">Export format</label>
  <select id="format">
    <option value="json">JSON</option>
    <option value="text">Plain text</option>
    <option value="html">HTML (with images)</option>
  </select>

  <button class="btn" id="btn-export" disabled>Export visible messages</button>
  <button class="btn" id="btn-scroll-export" disabled>Scroll all + export</button>
  <button class="btn" id="btn-stop">Stop</button>

  <details id="multi">
    <summary>Export several chats</summary>
    <button class="btn" id="btn-load-chats" disabled>Load chat list</button>
    <input id="chat-search" type="search" placeholder="Filter by name" hidden>
    <label class="select-all" hidden><input type="checkbox" id="select-all"> Select all shown</label>
    <div id="chat-list"></div>
    <button class="btn" id="btn-export-selected" disabled>Export selected (0)</button>
  </details>

  <div id="status">Loading…</div>
  <p class="disclaimer">Independent extension. Not affiliated with WhatsApp or Meta.</p>

  <script src="chat-list.js"></script>
  <script src="popup.js"></script>
</body>
</html>
