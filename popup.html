<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Chat Export</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111b21;
      color: #e9edef;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    header img {
      width: 28px;
      height: 28px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #25d366;
    }

    #chat-name {
      font-size: 13px;
      color: #aebac1;
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 18px;
    }

    label {
      font-size: 12px;
      color: #aebac1;
      display: block;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      padding: 7px 10px;
      background: #202c33;
      border: 1px solid #2a3942;
      border-radius: 6px;
      color: #e9edef;
      font-size: 13px;
      margin-bottom: 12px;
      appearance: none;
      cursor: pointer;
    }

    select:focus { outline: none; border-color: #25d366; }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: 0.88; }

    #btn-export {
      background: #25d366;
      color: #111b21;
    }

    #btn-scroll-export {
      background: #2a3942;
      color: #e9edef;
    }

    #btn-stop {
      background: #e53935;
      color: #fff;
      display: none;
    }

    #status {
      font-size: 12px;
      color: #aebac1;
      margin-top: 4px;
      min-height: 18px;
      text-align: center;
    }

    #status.error { color: #f28b82; }
    #status.ok    { color: #25d366; }
  </style>
</head>
<body>
  <header>
    <svg width="28" height="28" viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg">
      <circle cx="64" cy="64" r="64" fill="#25D366"/>
      <path fill="white" d="M64 26C43.5 26 27 42.5 27 63c0 7.8 2.5 15 6.7 20.9L28 103l19.8-5.2A36.8 36.8 0 0064 100c20.5 0 37-16.5 37-37S84.5 26 64 26z"/>
      <path fill="#25D366" d="M83.5 74.2c-.4-.2-4.8-2.4-5.6-2.7c-.8-.3-1.3-.4-1.9.4c-.6.9-2.2 2.7-2.7 3.2c-.5.6-1 .6-1.8.2c-.9-.4-3.6-1.3-6.8-4.2c-2.5-2.2-4.2-5-4.7-5.8c-.5-.9 0-1.4.4-1.8l1.1-1.4c.4-.5.5-.9.7-1.5c.3-.6.1-1.1-.1-1.5c-.2-.4-1.9-4.6-2.6-6.3c-.7-1.6-1.4-1.4-1.9-1.4l-1.6-.03c-.6 0-1.5.2-2.3 1c-.8.8-3 2.9-3 7.1s3.1 8.2 3.5 8.8c.4.5 6 9.2 14.6 12.9c2 .9 3.6 1.4 4.8 1.8c2 .6 3.9.5 5.3.3c1.6-.2 5-2 5.7-4c.7-1.9.7-3.5.5-3.8c-.2-.3-.7-.5-1.6-.8z"/>
      <circle cx="112" cy="112" r="34" fill="white"/>
      <g stroke="#25D366" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="112" y1="96" x2="112" y2="120"/>
        <polyline points="100,109 112,121 124,109"/>
        <line x1="99" y1="129" x2="125" y2="129"/>
      </g>
    </svg>
    <h1>WhatsApp Export</h1>
  </header>

  <div id="chat-name">Opening chat…</div>

  <label for="format">Export format</label>
  <select id="format">
    <option value="json">JSON</option>
    <option value="text">Plain text</option>
    <option value="html">HTML (with images)</option>
  </select>

  <button class="btn" id="btn-export" disabled>Export visible messages</button>
  <button class="btn" id="btn-scroll-export" disabled>Scroll all + export</button>
  <button class="btn" id="btn-stop">Stop</button>

  <div id="status">Loading…</div>

  <script src="popup.js"></script>
</body>
</html>
